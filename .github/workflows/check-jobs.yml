name: Check jobs

on:
  schedule:
    - cron: "23 */3 * * *"   # every 3 hours (UTC); GitHub may start runs a few minutes late
  workflow_dispatch: {}       # adds a "Run workflow" button on the Actions tab
  push:                       # also run right after the checker or watchlist changes
    branches: [main]
    paths: ["fetch_jobs.py", "watchlist.json", "probe.py", "probe_targets.json"]

permissions:
  contents: write             # lets the run save its results back to the repository

concurrency:
  group: check-jobs
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check company job boards
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python fetch_jobs.py
      - name: Probe new career sites (only when probe_targets.json changed)
        continue-on-error: true
        timeout-minutes: 10
        run: python probe.py
      - name: Save results
        run: |
          git config user.name "job-checker"
          git config user.email "job-checker@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Job check $(date -u '+%Y-%m-%d %H:%M') UTC"
            git pull --rebase origin main || true
            git push
          fi
